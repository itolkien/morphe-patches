name: Caption layout safe reflow (experiment)

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/caption-layout-safe-reflow

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test captions and build MPP
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:youtube:testDebugUnitTest :patches:buildAndroid --no-daemon

      - name: Upload experimental patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: caption-layout-safe-reflow-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
