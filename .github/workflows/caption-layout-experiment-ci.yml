name: Experimental caption layout offline validation

on:
  push:
    branches:
      - experiment/caption-window-stack-offline
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and build caption layout candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: JVM tests and Android unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:youtube:testDebugUnitTest --no-daemon

      - name: Build Android patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload patch build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: caption-window-stack-test-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: warn
